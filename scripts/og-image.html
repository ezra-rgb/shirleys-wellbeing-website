<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>OG image source</title>
<style>
  @font-face { font-family: 'Archivo'; font-weight: 800; src: url('../node_modules/@fontsource/archivo/files/archivo-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Public Sans'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/public-sans/files/public-sans-latin-wght-normal.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; background: #121417; overflow: hidden; }
  .frame { box-sizing: border-box; width: 1200px; height: 630px; padding: 64px 72px 0 84px; display: grid; grid-template-columns: 1fr 360px; gap: 48px; position: relative; }
  .text { display: flex; flex-direction: column; justify-content: center; padding-bottom: 40px; }
  .eyebrow { font-family: 'Public Sans'; font-weight: 650; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #D9A441; margin: 0 0 22px; }
  h1 { font-family: 'Archivo'; font-weight: 800; font-size: 76px; line-height: 1.0; letter-spacing: -0.035em; color: #ECEAE4; margin: 0 0 32px; }
  .tag { font-family: 'Public Sans'; font-weight: 700; font-size: 26px; color: #D9A441; margin: 0; }
  .url { font-family: 'Public Sans'; font-size: 22px; color: #A8ADB5; margin: 8px 0 0; }
  .logo { align-self: center; width: 360px; padding-bottom: 40px; }
  .dawn { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: linear-gradient(90deg, #b39ddb, #7fb4e0 25%, #86c29a 50%, #f2b544 75%, #e8846b); }
</style>
</head>
<body>
  <div class="frame">
    <div class="text">
      <p class="eyebrow">For people in retail affected by violence and abuse at work</p>
      <h1>It happened at work. It's still with you.</h1>
      <p class="tag">See the person first.</p>
      <p class="url">shirleyswellbeingcic.co.uk</p>
    </div>
    <img class="logo" src="../src/assets/brand/logo-stacked.png" alt="">
    <div class="dawn"></div>
  </div>
</body>
</html>
